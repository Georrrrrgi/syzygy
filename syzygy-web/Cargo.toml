[package]
name = "syzygy-web"
version = "0.1.0"
edition = "2021"
description = "The SYZYGY WASM frontend — pretentiousness rendered in the browser."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = "0.7"
leptos_router = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
gloo-net = "0.6"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
web-sys = { version = "0.3", features = ["HtmlInputElement", "HtmlTextAreaElement"] }
console_log = "1"
console_error_panic_hook = "0.1"
log = "0.4"

[features]
csr = ["leptos/csr", "leptos_router/csr"]
default = ["csr"]
